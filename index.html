<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Household Budget Tracker</h1>
  </header>

  <section id="expense-section">
    <h2>Add Expense</h2>

    <label for="person-select">Person:</label>
    <select id="person-select">
      <option value="Abhinandan">Abhinandan</option>
      <option value="Anchal">Anchal</option>
    </select>

    <input type="text" id="expense-name" placeholder="Expense name">
    <input type="number" id="expense-amount" placeholder="Amount">

    <label for="expense-type">Type:</label>
    <select id="expense-type">
      <option value="Fixed">Fixed</option>
      <option value="Variable">Variable</option>
    </select>

    <button id="add-expense-btn">Add Expense</button>
  </section>

  <section id="totals">
    <div class="person-card">
      <h2>Abhinandan</h2>
      <p>Total: ₹<span id="Abhinandan-total">0</span></p>
      <ul id="Abhinandan-list"></ul>
    </div>

    <div class="person-card">
      <h2>Anchal</h2>
      <p>Total: ₹<span id="Anchal-total">0</span></p>
      <ul id="Anchal-list"></ul>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
